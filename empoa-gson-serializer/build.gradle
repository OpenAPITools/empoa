plugins {
    id 'empoa.java-library-conventions'
}

dependencies {
    api libs.microprofile.openapi.api
    api libs.gson

    testImplementation project(':empoa-extended-tck')
    testImplementation libs.junit.jupiter.api
    testImplementation libs.assertj.core

    testRuntimeOnly project(':empoa-simple-models-impl')
    testRuntimeOnly libs.junit.jupiter.engine
}

publishing.publications.named('mavenJava') {
    pom {
        name = 'EMPOA Gson Serializer'
        description = 'JSON Serializer using Gson for Eclipse MicroProfile OpenAPI interfaces'
    }
}
