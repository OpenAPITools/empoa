name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        # Java 8 is the toolchain the modules compile and test against, Java 17 runs Gradle (last one is the default)
        java-version: |
          8
          17
        distribution: 'zulu'
    - name: print Java version
      run: java -version
    - name: Build
      run: ./gradlew clean build
