plugins {
    id 'com.diffplug.spotless' version '7.2.1' apply false
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.ajoberstar.git-publish' version '5.1.3'
    id 'org.jreleaser' version '1.26.0'
    id 'net.researchgate.release' version '3.2.0'
}

wrapper {
    gradleVersion = '9.8.2'
}

def repositoryPath = 'build/staging-deploy'

allprojects {
    apply plugin: 'maven-publish'

    group = 'org.openapitools.empoa'
}

subprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            importOrder 'java', 'javax', 'org', 'com', ''
            removeUnusedImports()

            // available versions are: https://github.com/diffplug/spotless/tree/master/lib-extra/src/main/resources/com/diffplug/spotless/extra/eclipse_jdt_formatter
            eclipse('4.13.0').configFile('.settings/org.eclipse.jdt.core.prefs')
        }
    }

    repositories {
        // mavenLocal()
        mavenCentral()
    }

    pluginManager.withPlugin('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(8)
            }
            withSourcesJar()
            withJavadocJar()
        }

        dependencies {
            testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformVersion"
        }
    }

    publishing {
        repositories {
            maven {
                url = rootProject.file(repositoryPath)
            }
        }
    }
}

jreleaser {
    signing {
        active = 'RELEASE'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                openapitools {
                    active = 'RELEASE'
                    namespace = 'org.openapitools'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository(repositoryPath)
                    retryDelay = 30
                    maxRetries = 150
                }
            }
        }
    }
    release {
        github {
            enabled = true
            repoOwner = "$githubRepositoryOwner"
            name = "$githubRepositoryName"
            tagName = '{{projectVersion}}'
            overwrite = true
            skipTag = true
            releaseNotes {
                enabled = true
            }
            changelog {
                enabled = false
            }
            milestone {
                close = true
            }
            issues {
                enabled = true
                comment = 'This issue has been resolved in `{{tagName}}` ([Release Notes]({{releaseNotesUrl}}))'
                applyMilestone = 'ALWAYS'
                label {
                    name = 'released'
                    color = '#FF0000'
                    description = 'Issue has been released'
                }
            }
        }
    }
}

def buildDate() {
    return new Date().format('yyyy-MM-dd')
}

configurations {
    asciidoctorExtensions
}

asciidoctorj {
    version = "$asciidoctorjVersion"
}

asciidoctor {
    configurations 'asciidoctorExtensions'
    sourceDir = file('docs')
    baseDirFollowsSourceFile()
    outputDir = file('build/docs/html5')
    attributes = ['revdate'           : "${buildDate()}",
                  'project-version'   : "$version",
                  'artifacts-version' : "$lastVersion",
                  'mp-openapi-version': "$mpOpenAPIVersion",
                  'gh-repo-owner'     : "$githubRepositoryOwner",
                  'gh-repo-name'      : "$githubRepositoryName",
                  'source-highlighter': 'coderay',
                  'imagesdir'         : '',
                  'toc'               : 'left',
                  'toclevels'         : '3',
                  'icons'             : 'font',
                  'sectanchors'       : 'true',
                  'idprefix'          : '',
                  'idseparator'       : '-',
                  'docinfo1'          : 'true']
    repositories {
        mavenCentral()
    }
    dependencies {
        asciidoctorExtensions('fr.jmini.asciidoctorj:git-link:3.2.2') {
            transitive = false
        }
    }
}

gitPublish {
    repoUri = 'git@github.com:' + "$githubRepositoryOwner" + '/' + "$githubRepositoryName" + '.git'
    branch = 'gh-pages'

    contents {
        from "${file('build/docs/html5')}"
    }

    preserve {
        include '.nojekyll'
    }

    commitMessage = "Update the 'gh-pages' branch."
}

release {
    buildTasks = [
        'checkLastVersionValue',
        'clean',
        'build',
        'publish',
        'jreleaserDeploy',
        'asciidoctor',
        'gitPublishPush'
    ]
    git {
        requireBranch.set('master')
    }
}

tasks.register('checkLastVersionValue') {
    doLast {
        if(version.endsWith('SNAPSHOT')) {
            throw new GradleException("version '$version' ends with SNAPSHOT, this is not a release build!")
        }
        if(lastVersion != version) {
            throw new GradleException("lastVersion '$lastVersion' does not match version '$version', fix it in the 'gradle.properties' file.")
        }
    }
}

def updateLastVersionValueTask = tasks.register('updateLastVersionValue') {
    doLast {
        def propertiesFile = file('gradle.properties')
        def content = propertiesFile.text
        def newVersion = project.findProperty('release.releaseVersion') ?: version.replace('-SNAPSHOT', '')
        content = content.replaceAll("lastVersion=[0-9a-z\\.\\-]+", "lastVersion=" + newVersion)
        propertiesFile.text = content
    }
}

tasks.named('unSnapshotVersion') {
    dependsOn updateLastVersionValueTask
}
